<ion-header [translucent]="false" class="custom-header">
  <div class="header-container">
    <button class="back-btn" (click)="goBack()">
      <i class="fa fa-chevron-left" aria-hidden="true"></i>
    </button>
    <h1 class="header-title">Analytics</h1>
    <div style="width: 32px;"></div> <!-- Spacer to keep title centered -->
  </div>
</ion-header>

<ion-content class="ioncontent">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content pullingText="Pull to refresh" refreshingSpinner="crescent"></ion-refresher-content>
  </ion-refresher>
  <!-- Segment Tabs -->
  <div class="analytics-segment">
    <button [class.active]="selectedTab === 'today'" (click)="selectTab('today')">Today</button>
    <button [class.active]="selectedTab === 'week'" (click)="selectTab('week')">Weekly</button>
    <button [class.active]="selectedTab === 'month'" (click)="selectTab('month')">Monthly</button>
  </div>

  <!-- Stats Grid -->
  <div class="stat-grid">

    <!-- Row 1: Orders + Completion -->
    <div class="caard-1">
      <div class="card-title">{{ currentData?.totalOrders || 0 }}</div>
      <div class="card-sub">Total Orders</div>
    </div>
    <div class="caard-1">
      <div class="card-title">{{ currentData?.completionRate || 0 }}%</div>
      <div class="card-sub">Completion Rate</div>
    </div>

    <!-- Row 2: Line Chart -->
    <div class="caard-1 chart-card full-width">
      <div class="chart-header">
        <span class="chart-title">Orders Flow</span>
      </div>
      <canvas id="lineChart"></canvas>
    </div>

    <!-- Row 3: Top Day + Repeat Customers -->
    <div class="caard-1">
      <div class="card-title">{{ topDay?.day || '-' }}</div>
      <div class="card-sub">Top Performing Day</div>
    </div>
    <div class="caard-1">
      <div class="card-title">{{ repeatCustomerPercentage || 0 }}%</div>
      <div class="card-sub">Repeat Customers</div>
    </div>

    <!-- Row 4: Bar Chart -->
    <div class="caard-1 chart-card full-width">
      <div class="chart-header">
        <span class="chart-title">Earnings Summary</span>
      </div>
      <canvas id="barChart"></canvas>
    </div>
  </div>
</ion-content>
