<ion-header [translucent]="false" class="custom-header">
  <div class="header-container">
    <button class="back-btn" (click)="goBack()">
      <i class="fa fa-chevron-left" aria-hidden="true"></i>
    </button>
    <h1 class="header-title">Withdrawal History</h1>
    <div class="header-right-placeholder"></div>
  </div>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="withdrawal-container pBottom">
    <div class="transactions-list-section">
      <h2 class="section-title">Latest Withdrawals</h2>
      
      <div class="transactions-list">
        <div *ngFor="let tx of transactions" class="transaction-card-item">
          <!-- Left accent color bar based on transaction status -->
          <div class="card-accent" [ngClass]="tx.status.toLowerCase()"></div>

          <div class="card-details">
            <div class="details-top">
              <span class="amount-value">{{ tx.amount }}</span>
              <!-- Status Badge -->
              <span class="status-badge" [ngClass]="tx.status.toLowerCase()">
                <ion-icon [name]="getStatusIcon(tx.status)" class="badge-icon"></ion-icon>
                <span>{{ tx.status }}</span>
              </span>
            </div>

            <div class="details-bottom">
              <span class="time-meta">
                <i class="fa fa-calendar-o" aria-hidden="true"></i> {{ tx.date }}
              </span>
              <span class="time-meta">
                <i class="fa fa-clock-o" aria-hidden="true"></i> {{ tx.time }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
