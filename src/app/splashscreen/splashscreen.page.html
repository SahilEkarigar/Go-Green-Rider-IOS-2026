<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content pullingText="Pull to refresh" refreshingSpinner="crescent"></ion-refresher-content>
  </ion-refresher>
  <div class="splashmain h_100vh">
    <img
      src="../../assets/splashscreen/splash_1.svg"
      class="boundries"
      alt="boundries"
      title="boundries">

    <img
      src="../../assets/icon/logo_gogreen.svg"
      class="gogreen_logo"
      alt="gogreen"
      title="gogreen">

    <img
      src="../../assets/splashscreen/splash_2.svg"
      class="leaf"
      alt="leaf"
      title="leaf">
  </div>
</ion-content>
