<ion-header [translucent]="false" class="custom-header">
  <div class="header-container">
    <button class="back-btn" (click)="goBack()">
      <i class="fa fa-chevron-left" aria-hidden="true"></i>
    </button>
    <h1 class="header-title">Rider Status</h1>
    <button class="save-btn-header" (click)="saveRiderStatus()">
      <i class="fa fa-check" aria-hidden="true"></i>
    </button>
  </div>
</ion-header>

<ion-content class="ioncontent">
  <div class="container body_container">
    
    <!-- 1. Rider Status Card -->
    <div class="profile-card status-card" [ngClass]="{'online-mode': shopStatus, 'offline-mode': !shopStatus}">
      <div class="status-header">
        <span class="status-label">Rider Status</span>
        <ion-toggle [(ngModel)]="shopStatus" id="shopStatusToggle" color="success" class="custom-toggle"></ion-toggle>
      </div>
      <div class="status-badge-container">
        <span class="status-text-prefix">Current Status:</span>
        <span class="status-badge" [ngClass]="{'badge-online': shopStatus, 'badge-offline': !shopStatus}">
          {{ shopStatus ? 'Online' : 'Offline' }}
        </span>
      </div>
    </div>

    <!-- 2. Delivery Timings Card -->
    <div class="profile-card timings-card">
      <h3 class="card-title">Delivery Timings</h3>
      <div class="form-container">
        
        <div class="form-group">
          <label for="openTime">Start Delivery Time</label>
          <input type="time" [(ngModel)]="openTime" id="openTime" class="form-control" />
        </div>

        <div class="form-group">
          <label for="closeTime">End Delivery Time</label>
          <input type="time" [(ngModel)]="closeTime" id="closeTime" class="form-control" />
        </div>

      </div>
    </div>

  </div>
</ion-content>
