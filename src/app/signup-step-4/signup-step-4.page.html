<ion-header class="ion-no-border bg_white">

  <div class="container my_common_header">

    <ion-row>

      <ion-col
        size="12"
        class="common_header">

      </ion-col>

    </ion-row>

  </div>

</ion-header>


<ion-content [fullscreen]="true" class="ioncontent" (click)="dismissKeyboard()">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content pullingText="Pull to refresh" refreshingSpinner="crescent"></ion-refresher-content>
  </ion-refresher>

  <div class="container" (click)="dismissKeyboard()">

    <ion-row class="signup_steps_row">

      <ion-col size="12">

        <div class="signup_steps">

          <!-- Page Heading -->
          <h2 class="text-center">
            Register
          </h2>


          <!-- Stepper -->
          <div class="step_counts">

            <div class="stepper">

              <div class="step active">
                <div class="circle">1</div>
              </div>

              <div class="step active">
                <div class="circle">2</div>
              </div>

              <div class="step">
                <div class="circle">3</div>
              </div>

              <div class="step">
                <div class="circle">4</div>
              </div>

            </div>

          </div>


          <h4 class="text-center mt-2">
            Personal Details
          </h4>


          <form
            class="form_box"
            novalidate
            (click)="$event.stopPropagation()">


            <!-- Address -->
            <div class="form_input_box">

              <label for="address">
                Address
              </label>

              <input
                type="text"
                [(ngModel)]="address"
                (input)="onAddressInput()"
                (focus)="onInputFocus()"
                (blur)="onInputBlur()"
                (keyup.enter)="dismissKeyboard()"
                [ngClass]="{'input-error': isAddressInvalid}"
                id="address"
                name="address"
                class="form-control"
                placeholder="Enter your address"
                autocomplete="street-address"
                autocorrect="on"
                spellcheck="false">

              <div
                *ngIf="isAddressInvalid"
                class="error-message mt-1">

                {{ addressErrorMessage }}

              </div>

            </div>


            <!-- Date of Birth -->
            <div class="form_input_box">

              <label for="dob">
                Date of Birth
              </label>

              <input
                type="date"
                [(ngModel)]="dob"
                (change)="onDobChange()"
                (focus)="onInputFocus()"
                (blur)="onInputBlur()"
                (keyup.enter)="dismissKeyboard()"
                [ngClass]="{'input-error': isDobInvalid}"
                id="dob"
                name="dob"
                class="form-control"
                [max]="maxDate">

              <div
                *ngIf="isDobInvalid"
                class="error-message mt-1">

                {{ dobErrorMessage }}

              </div>

            </div>


            <!-- Identity Proof -->
            <div class="form_input_box">

              <label for="identityProof">
                Identity Proof
              </label>

              <input
                type="file"
                (change)="onIdentityProofSelected($event)"
                id="identityProof"
                name="identityProof"
                class="form-control"
                accept="image/jpeg,image/png,image/webp"
                [ngClass]="{'input-error': isIdentityProofInvalid}">

              <div class="upload_note">
                JPG, PNG or WEBP. Maximum file size 5 MB.
              </div>

              <div
                *ngIf="isIdentityProofInvalid"
                class="error-message mt-1">

                {{ identityProofErrorMessage }}

              </div>

            </div>


            <!-- Optional Other Phone -->
            <div class="form_input_box">

              <label for="otherPhone">

                Other Phone Number

                <span class="optional_text">
                  (Optional)
                </span>

              </label>


              <div class="prefix_phone_box">

                <select
                  [(ngModel)]="otherPrefix"
                  id="otherPrefix"
                  name="otherPrefix"
                  class="form-control prefix-select"
                  aria-label="Country code">

                  <option value="+1">
                    🇨🇦 +1
                  </option>

                </select>


                <input
                  type="tel"
                  [(ngModel)]="otherPhone"
                  (input)="onOtherPhoneInput($event)"
                  (focus)="onInputFocus()"
                  (blur)="validateOptionalPhone(); onInputBlur()"
                  (keyup.enter)="dismissKeyboard()"
                  [ngClass]="{'input-error': isOtherPhoneInvalid}"
                  id="otherPhone"
                  name="otherPhone"
                  class="form-control"
                  placeholder="(XXX) XXX XXXX"
                  inputmode="numeric"
                  maxlength="10"
                  autocomplete="tel">

              </div>


              <div
                *ngIf="isOtherPhoneInvalid"
                class="error-message mt-1">

                {{ otherPhoneErrorMessage }}

              </div>

            </div>


            <!-- Profile Image -->
            <div class="form_input_box">

              <label for="profileImage">
                Profile Image
              </label>

              <input
                type="file"
                (change)="onProfileImageSelected($event)"
                id="profileImage"
                name="profileImage"
                class="form-control"
                accept="image/jpeg,image/png,image/webp"
                [ngClass]="{'input-error': isProfileImageInvalid}">

              <div class="upload_note">
                Upload a clear profile photo in JPG, PNG or WEBP format.
              </div>

              <div
                *ngIf="isProfileImageInvalid"
                class="error-message mt-1">

                {{ profileImageErrorMessage }}

              </div>

            </div>

          </form>


          <!-- General API Error -->
          <div
            *ngIf="generalError"
            class="general_error_box">

            <p class="error-message">
              {{ generalError }}
            </p>

          </div>

        </div>

      </ion-col>

    </ion-row>

  </div>

  <!-- Floating Keyboard Dismiss Button -->
  <button
    type="button"
    class="floating-keyboard-dismiss-btn"
    *ngIf="isKeyboardActive"
    (click)="dismissKeyboard(); $event.stopPropagation()"
    aria-label="Hide keyboard">
    <ion-icon name="chevron-down-outline"></ion-icon>
    <span>Hide Keyboard</span>
  </button>

</ion-content>


<ion-footer class="ion-no-border">

  <div class="container">

    <ion-row>

      <ion-col
        size="12"
        class="common_footer">

        <div class="button_group">

          <button
            type="button"
            class="theme_button"
            (click)="NextStep()">

            Continue

          </button>

        </div>

      </ion-col>

    </ion-row>

  </div>

</ion-footer>
