<ion-content class="ioncontent">
  <div class="zero_padding">
    <div class="row header_row">
      <div class="my_common_header">
        <ion-col size="2" class="common_header">
          <div (click)="goBack()" class="back_arrow_div">
            <i class="fa fa-chevron-circle-left" aria-hidden="true"></i>
          </div>
        </ion-col>
        <ion-col size="8" class="upload_product_heading">
          <h2>User Profile</h2>
        </ion-col>
        <ion-col size="2" class="check_right" (click)="updateProfile()">
          <i class="fa fa-check" aria-hidden="true"></i>
        </ion-col>
      </div>
    </div>
  </div>

  <div class="container body_container">
    <div class="contain-bank">
      <div class="create_account">
        <div class="profile-wrapper">
          <img [src]="riderProfilePicture || 'assets/home/shop.jpeg'" (error)="onImageError($event)"
            class="profile-image" alt="Profile" />
          <div class="camera-icon" (click)="fileInput.click()">
            <img src="../../assets/home/camera.svg" alt="Camera Icon" />
            <input type="file" #fileInput (change)="onImageSelected($event)" accept="image/*" hidden />
          </div>
        </div>
      </div>
      <div class="content-business">
        <div class="form_input_box d-flex gap-1">

          <!-- <div *ngIf="isSkeleton" class="skeleton-input"></div> -->

          <div>
            <label for="fname">First Name</label>
            <input type="text" [(ngModel)]="fname" id="fname" name="fname" class="form-control"
              placeholder="Enter First Name" />
          </div>
          <div >
            <label for="lname">Last Name</label>
            <input type="text" [(ngModel)]="lname" id="lname" name="lname" class="form-control"
              placeholder="Enter Last Name" />
          </div>
        </div>
        <div class="form_input_box">
          <label for="userName">User Name</label>
          <input type="text" [(ngModel)]="userName" id="userName" name="userName" class="form-control"
            placeholder="Enter User Name" />
        </div>

        <div class="form_input_box">
          <label for="email">Email</label>
          <input type="email" disabled [(ngModel)]="email" id="email" name="email" class="form-control"
            placeholder="Enter Email">
        </div>

        <div class="form_input_box">
          <label for="phone">Mobile No</label>
          <div class="prefix_phone_box">
            <select disabled [(ngModel)]="prefix" id="prefix" name="prefix" class="form-control">
              <option value="+1">+1</option>
            </select>
            <input type="tel" disabled [(ngModel)]="phone" id="phone" name="phone" class="form-control"
              placeholder="Enter Mobile No">
          </div>
        </div>
        <div class="form_input_box">
          <label for="otherPhone">Other Mobile No</label>
          <div class="prefix_phone_box">
            <select [(ngModel)]="prefix" id="prefix" name="prefix" class="form-control">
              <option value="+1">+1</option>
            </select>
            <input type="tel" [(ngModel)]="otherPhone" id="otherPhone" name="otherPhone" class="form-control"
              placeholder="Enter Other Mobile No">
          </div>
        </div>

        <div class="form_input_box">
          <label for="dob">DOB</label>
          <input type="date" [(ngModel)]="dob" id="dob" name="dob" class="form-control" placeholder="Enter DOB">
        </div>
        <div class="form_input_box">
          <label for="addressInfo">Address</label>
          <textarea [(ngModel)]="addressInfo" id="addressInfo" name="addressInfo" class="form-control bg-transparent"
            placeholder="Enter your address">
          </textarea>
        </div>
      </div>
    </div>

</ion-content>
