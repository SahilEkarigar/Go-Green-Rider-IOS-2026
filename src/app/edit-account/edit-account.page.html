<ion-header [translucent]="false" class="custom-header">
  <div class="header-container">
    <button class="back-btn" (click)="goBack()">
      <i class="fa fa-chevron-left" aria-hidden="true"></i>
    </button>
    <h1 class="header-title">User Profile</h1>
    <button class="save-btn-header" (click)="updateProfile()">
      <i class="fa fa-check" aria-hidden="true"></i>
    </button>
  </div>
</ion-header>

<ion-content class="ioncontent">

  <div class="container body_container">
    <div class="profile-card">
      <div class="create_account">
        <div class="profile-wrapper">
          <img [src]="getProfileImage()" (error)="onImageError($event)"
            class="profile-image" alt="Profile" />
          <div class="camera-icon" (click)="fileInput.click()">
            <img src="../../assets/home/camera.svg" alt="Camera Icon" />
            <input type="file" #fileInput (change)="onImageSelected($event)" accept="image/*" hidden />
          </div>
        </div>
      </div>

      <div class="form-container">
        <!-- First Name & Last Name horizontal layout -->
        <div class="form-row-2">
          <div class="form-group">
            <label for="fname">First Name</label>
            <input type="text" [(ngModel)]="fname" id="fname" name="fname" class="form-control"
              placeholder="Enter First Name" />
          </div>
          <div class="form-group">
            <label for="lname">Last Name</label>
            <input type="text" [(ngModel)]="lname" id="lname" name="lname" class="form-control"
              placeholder="Enter Last Name" />
          </div>
        </div>

        <!--<div class="form-group">
          <label for="userName">User Name</label>
          <input type="text" [(ngModel)]="userName" id="userName" name="userName" class="form-control"
            placeholder="Enter User Name" />
        </div>-->

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" disabled [(ngModel)]="email" id="email" name="email" class="form-control disabled-input"
            placeholder="Enter Email">
        </div>

        <div class="form-group">
          <label for="phone">Mobile No</label>
          <div class="phone-input-group">
            <select disabled [(ngModel)]="prefix" id="prefix" name="prefix" class="prefix-select">
              <option value="+1">+1</option>
            </select>
            <input type="tel" disabled [(ngModel)]="phone" id="phone" name="phone" class="form-control phone-input disabled-input"
              placeholder="Enter Mobile No">
          </div>
        </div>

        <div class="form-group">
          <label for="otherPhone">Other Mobile No</label>
          <div class="phone-input-group">
            <select [(ngModel)]="prefix" id="prefix" name="prefix" class="prefix-select">
              <option value="+1">+1</option>
            </select>
            <input type="tel" [(ngModel)]="otherPhone" id="otherPhone" name="otherPhone" class="form-control phone-input"
              placeholder="Enter Other Mobile No">
          </div>
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" [(ngModel)]="dob" id="dob" name="dob" class="form-control" placeholder="Enter DOB">
        </div>

        <div class="form-group">
          <label for="addressInfo">Address</label>
          <textarea [(ngModel)]="addressInfo" id="addressInfo" name="addressInfo" class="form-control textarea-input"
            placeholder="Enter your address"></textarea>
        </div>
      </div>
    </div>
  </div>

</ion-content>
