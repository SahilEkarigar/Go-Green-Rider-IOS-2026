<ion-header [translucent]="false" class="custom-header">
  <div class="header-container">
    <button class="back-btn" (click)="goBack()">
      <i class="fa fa-chevron-left" aria-hidden="true"></i>
    </button>
    <h1 class="header-title">Reviews & Ratings</h1>
    <div class="header-right-placeholder"></div>
  </div>
</ion-header>

<ion-content class="ion-padding">
  <div class="main-container">
    <!-- Ratings Summary Card -->
    <div class="rating-summary-card">
      <div class="summary-left">
        <h1 class="rating-score">4.5</h1>
        <div class="stars-row">
          <i class="fa fa-star"></i>
          <i class="fa fa-star"></i>
          <i class="fa fa-star"></i>
          <i class="fa fa-star"></i>
          <i class="fa fa-star-half-o"></i>
        </div>
        <p class="rating-count">43 Ratings</p>
      </div>

      <div class="summary-right">
        <div *ngFor="let rating of ratings" class="progress-bar-group">
          <span class="star-label">{{ rating.stars }} ★</span>
          <div class="progress-track">
            <div class="progress-fill" [ngStyle]="{ width: (rating.percent * 100) + '%' }"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="section-divider"></div>

    <!-- Review Comments List -->
    <div class="comments-section">
      <h2 class="section-title">Latest Reviews</h2>
      
      <div *ngFor="let comment of comments; let i = index" class="review-card">
        <div class="card-header">
          <img [src]="comment.profile" alt="Profile" class="reviewer-avatar" />
          <div class="reviewer-info">
            <div class="reviewer-top">
              <h3 class="reviewer-name">{{ comment.user }}</h3>
              <span class="review-date">{{ comment.date }}</span>
            </div>
            
            <div class="review-meta">
              <div class="stars-mini">
                <i class="fa fa-star" *ngFor="let s of [].constructor(comment.rating)"></i>
              </div>
              <strong class="score-value">{{ comment.rating | number:'1.1-1' }}</strong>
            </div>
          </div>
        </div>

        <div class="card-body">
          <p class="review-text">{{ comment.text }}</p>
        </div>
      </div>
    </div>
  </div>
</ion-content>
