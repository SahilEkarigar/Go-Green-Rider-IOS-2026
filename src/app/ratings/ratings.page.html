  <div class="zero_padding">
    <div class="row header_row">
      <div class="my_common_header">
        <ion-col size="2" class="common_header">
          <div (click)="goBack()" class="back_arrow_div">
            <i class="fa fa-chevron-circle-left" aria-hidden="true"></i>
          </div>
        </ion-col>
        <ion-col size="8" class="upload_product_heading">
          <h2>Reviews & Ratings</h2>
        </ion-col>
        <ion-col size="2" class="check_right">
          <i class="fa fa-check" aria-hidden="true"></i>
        </ion-col>
      </div>
    </div>
  </div>
</ion-header>

<ion-content class="ion-padding">
  <div class="rating-container">
    <div class="left">
      <h1>4.5</h1>
      <div class="stars">
        <i class="fa fa-star"></i>
        <i class="fa fa-star"></i>
        <i class="fa fa-star"></i>
        <i class="fa fa-star"></i>
        <i class="fa fa-star-half"></i>
      </div>
      <p>43 Ratings</p>
    </div>

    <div class="right">
      <div *ngFor="let rating of ratings" class="bar-group">
        <span class="bar-label">{{ rating.stars }} stars</span>
        <div class="bar">
          <div
            class="fill"
            [ngStyle]="{ width: (rating.percent * 100) + '%' }"
          ></div>
        </div>
      </div>
    </div>
  </div>
  <!-- close rating-container -->

  <div class="seperatr"></div>

  <div class="main-ratings">
    <div *ngFor="let comment of comments; let i = index" class="card-1">
      <img [src]="comment.profile" alt="Profile" class="profile-pic" />
      <div class="profile-section">
        <div class="review-card">
          <div>
            <div class="user-name">{{ comment.user }}</div>
            <div class="stars-small">
              <i
                class="fa fa-star"
                *ngFor="let s of [].constructor(comment.rating)"
              ></i>
              <strong class="staring"
                >{{ comment.rating | number:'1.1-1' }}</strong
              >
            </div>
          </div>
          <div>
            <p>{{ comment.text }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
