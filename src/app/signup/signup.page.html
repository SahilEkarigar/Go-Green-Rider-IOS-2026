<ion-header class="ion-no-border bg_white">

  <div class="container my_common_header" style="margin-top: 0px;">

    <ion-row>

      <ion-col
        size="12"
        class="common_header">

        <div
          class="back_arrow_div"
          (click)="goBack()">

          <i
            class="fa fa-chevron-left"
            aria-hidden="true">
          </i>

        </div>

      </ion-col>

    </ion-row>

  </div>

</ion-header>


<ion-content class="ioncontent container" (click)="dismissKeyboard()">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content pullingText="Pull to refresh" refreshingSpinner="crescent"></ion-refresher-content>
  </ion-refresher>

  <div class="container" (click)="dismissKeyboard()">

    <div class="row signup_steps_row">

      <div class="signup_steps">

        <!-- PAGE HEADING -->
        <ion-row>

          <ion-col size="12">

            <h2 class="text-center">
              Register
            </h2>

            <h4 class="text-center">
              Create your rider account
            </h4>

          </ion-col>

        </ion-row>


        <!-- STEPPER -->
        <div class="step_counts">

          <div class="stepper">

            <div class="step active">
              <div class="circle">1</div>
            </div>

            <div class="step">
              <div class="circle">2</div>
            </div>

            <div class="step">
              <div class="circle">3</div>
            </div>

            <div class="step">
              <div class="circle">4</div>
            </div>

          </div>

        </div>


        <!-- FORM -->
        <div class="form_box" (click)="$event.stopPropagation()">


          <!-- FIRST NAME -->
          <div class="form_input_box">

            <label for="fname">
              First Name
            </label>

            <input
              id="fname"
              name="fname"
              type="text"
              class="form-control"
              [class.input-error]="isFnameInvalid"
              [(ngModel)]="fname"
              (input)="clearFieldError('fname')"
              (focus)="onInputFocus()"
              (blur)="onInputBlur()"
              (keyup.enter)="dismissKeyboard()"
              placeholder="Enter your first name"
              autocomplete="given-name"
              autocorrect="on"
              spellcheck="false">

            <p
              *ngIf="errorField === 'fname' && generalError"
              class="error-message">
              {{ generalError }}
            </p>

          </div>


          <!-- LAST NAME -->
          <div class="form_input_box">

            <label for="lname">
              Last Name
            </label>

            <input
              id="lname"
              name="lname"
              type="text"
              class="form-control"
              [class.input-error]="isLnameInvalid"
              [(ngModel)]="lname"
              (input)="clearFieldError('lname')"
              (focus)="onInputFocus()"
              (blur)="onInputBlur()"
              (keyup.enter)="dismissKeyboard()"
              placeholder="Enter your last name"
              autocomplete="family-name"
              autocorrect="on"
              spellcheck="false">

            <p
              *ngIf="errorField === 'lname' && generalError"
              class="error-message">
              {{ generalError }}
            </p>

          </div>


          <!-- EMAIL -->
          <div class="form_input_box">

            <label for="email">
              Email Address
            </label>

            <input
              id="email"
              name="email"
              type="email"
              class="form-control"
              [class.input-error]="isEmailInvalid"
              [(ngModel)]="email"
              (input)="clearFieldError('email')"
              (focus)="onInputFocus()"
              (blur)="onEmailBlur(); onInputBlur()"
              (keyup.enter)="dismissKeyboard()"
              placeholder="Enter your email address"
              autocomplete="email"
              inputmode="email">

            <p
              *ngIf="errorField === 'email' && generalError"
              class="error-message">
              {{ generalError }}
            </p>

          </div>


          <!-- MOBILE NUMBER -->
          <div class="form_input_box">

            <label for="phone">
              Mobile Number
            </label>

            <div class="prefix_phone_box">

              <select
                name="prefix"
                [(ngModel)]="prefix"
                class="form-control prefix-select"
                aria-label="Country code">

                <option value="+1">
                  🇨🇦 +1
                </option>

              </select>


              <input
                id="phone"
                name="phone"
                type="tel"
                class="form-control"
                [class.input-error]="isPhoneInvalid"
                [(ngModel)]="phone"
                (input)="onPhoneInput($event)"
                (keydown)="allowOnlyNumbers($event)"
                (focus)="onInputFocus()"
                (blur)="onInputBlur()"
                (keyup.enter)="dismissKeyboard()"
                placeholder="(XXX) XXX XXXX"
                autocomplete="tel"
                inputmode="numeric"
                maxlength="10">

            </div>

            <p class="note_id">
              Enter a valid 10 digit mobile number.
            </p>

            <p
              *ngIf="errorField === 'phone' && generalError"
              class="error-message">
              {{ generalError }}
            </p>

          </div>


          <!-- PASSWORD -->
          <div class="form_input_box">

            <label for="password">
              Password
            </label>

            <div class="psw_box">

              <input
                id="password"
                name="password"
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                [class.input-error]="isPSWInvalid"
                [(ngModel)]="password"
                (input)="clearFieldError('password')"
                (focus)="onInputFocus()"
                (blur)="onInputBlur()"
                (keyup.enter)="dismissKeyboard()"
                placeholder="Enter your password"
                autocomplete="new-password">

              <button
                type="button"
                class="eye_box"
                (click)="togglePassword()"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">

                <i
                  class="fa"
                  [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
                  aria-hidden="true">
                </i>

              </button>

            </div>

            <p
              *ngIf="errorField === 'password' && generalError"
              class="error-message">
              {{ generalError }}
            </p>

          </div>


          <!-- CONFIRM PASSWORD -->
          <div class="form_input_box">

            <label for="cpassword">
              Confirm Password
            </label>

            <div class="psw_box">

              <input
                id="cpassword"
                name="cpassword"
                [type]="showCPassword ? 'text' : 'password'"
                class="form-control"
                [class.input-error]="isCPSWInvalid"
                [(ngModel)]="cpassword"
                (input)="clearFieldError('cpassword')"
                (focus)="onInputFocus()"
                (blur)="onInputBlur()"
                (keyup.enter)="dismissKeyboard()"
                placeholder="Confirm your password"
                autocomplete="new-password">

              <button
                type="button"
                class="eye_box"
                (click)="toggleCPassword()"
                [attr.aria-label]="showCPassword ? 'Hide password' : 'Show password'">

                <i
                  class="fa"
                  [ngClass]="showCPassword ? 'fa-eye-slash' : 'fa-eye'"
                  aria-hidden="true">
                </i>

              </button>

            </div>

            <p
              *ngIf="errorField === 'cpassword' && generalError"
              class="error-message">
              {{ generalError }}
            </p>

          </div>


          <!-- GENERAL API ERROR -->
          <div
            *ngIf="errorField === 'general' && generalError"
            class="form_input_box">

            <p class="error-message text-center">
              {{ generalError }}
            </p>

          </div>


          <!-- CONTINUE BUTTON -->
          <div class="button_group">

            <button
              type="button"
              class="theme_button"
              [disabled]="loading"
              (click)="NextStep()">

              <span *ngIf="!loading">
                Continue
              </span>

              <span *ngIf="loading">
                Please wait...
              </span>

            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Floating Keyboard Dismiss Button -->
  <button
    type="button"
    class="floating-keyboard-dismiss-btn"
    *ngIf="isKeyboardActive"
    (click)="dismissKeyboard(); $event.stopPropagation()"
    aria-label="Hide keyboard">
    <ion-icon name="chevron-down-outline"></ion-icon>
    <span>Hide Keyboard</span>
  </button>

</ion-content>
