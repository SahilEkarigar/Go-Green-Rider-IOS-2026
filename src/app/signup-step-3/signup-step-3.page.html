<ion-content [fullscreen]="true">
  <div class="container">
    <div class="row signup_steps_row">
      <div class="container my_common_header">
        <div class="row">
          <ion-col size="12" class="common_header">
            <!-- <div (click)="goBack()" class="back_arrow_div">
              <i class="fa fa-chevron-circle-left" aria-hidden="true"></i>
            </div> -->
          </ion-col>
        </div>
      </div>
      <div class="signup_steps ">
        <ion-col size="12">
          <h2 class="text-center">Sign Up</h2>
          <div class="step_counts">
            <div class="stepper">
              <div class="step active">
                <div class="circle">1</div>
              </div>
              <div class="step active">
                <div class="circle">2</div>
              </div>
              <div class="step active">
                <div class="circle">3</div>
              </div>
              <div class="step active">
                <div class="circle">4</div>
              </div>
            </div>
          </div>
          <h4 class="text-center">Bank Details (for Payouts)</h4>
          <div class="form_box">
            <div class="form_input_box">
              <label for="account_holder_name">Account Holder Name</label>
              <input type="text" [(ngModel)]="account_holder_name" [ngClass]="{'input-error': isAccount_holder_nameInvalid}" id="account_holder_name" name="account_holder_name" class="form-control"
                placeholder="Enter Account Holder Name">
            </div>
            <div class="form_input_box">
              <label for="institution_number">Institution Number</label>
              <input type="number" [(ngModel)]="institution_number" [ngClass]="{'input-error': isInstitution_numberInvalid}" id="institution_number" name="institution_number" class="form-control"
                placeholder="Enter 3-digit Institution Number">
            </div>
            <div class="form_input_box">
              <label for="transit_number">Transit Number</label>
              <input type="number" [(ngModel)]="transit_number" [ngClass]="{'input-error': isTransit_numberInvalid}" id="transit_number" name="transit_number" class="form-control"
                placeholder="Enter 5-digit Transit Number">
            </div>
            <div class="form_input_box">
              <label for="account_number">Account Number</label>
              <input type="number" [(ngModel)]="account_number" [ngClass]="{'input-error': isAccount_numberInvalid}" id="account_number" name="account_number" class="form-control"
                placeholder="Enter 7–12 digit Account Number">
            </div>
            <div class="form_input_box">
              <label for="void_cheque">Void Cheque or Direct Deposit Form (Optional)</label>
              <input type="file" (change)="onFileSelected($event)" [ngClass]="{'input-error': isVoid_chequeInvoice}" id="void_cheque" name="void_cheque" class="form-control"
                placeholder="Upload Void Cheque or Direct Deposit Form">
            </div>
          </div>

        </ion-col>
      </div>
      <div class="container my_common_header">
        <div class="row">
          <ion-col size="12" class="common_footer">
            <div class="button_group">
              <button type="button" class="btn theme_button_light mr_10" (click)="skip_Step()">Skip</button>
              <button type="button" class="btn theme_button" (click)="NextStep()">Submit</button>
            </div>
          </ion-col>
        </div>
      </div>
    </div>
  </div>
</ion-content>
