<ion-header [translucent]="false" class="custom-header">
  <div class="header-container">
    <button class="back-btn" (click)="goBack()">
      <i class="fa fa-chevron-left" aria-hidden="true"></i>
    </button>
    <h1 class="header-title">Balance & History</h1>
    <div class="header-right-placeholder"></div>
  </div>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="wallet-container">
    <!-- Balance Card Layout -->
    <div class="balance-card">
      <div class="card-glow"></div>
      <div class="balance-header">
        <span class="balance-label">Current Balance</span>
        <div class="trend-badge">
          <i class="fa fa-caret-up" aria-hidden="true"></i> 3.4%
        </div>
      </div>
      <h1 class="balance-amount">$ 1,250.00</h1>
      <div class="balance-actions">
        <button class="withdraw-card-btn">Withdraw Funds</button>
      </div>
    </div>

    <!-- Recent Transactions List -->
    <div class="transactions-section">
      <h3 class="section-title">Recent Transactions</h3>
      
      <div class="transactions-list">
        <div class="transaction-item-card">
          <div class="item-icon-wrapper debit">
            <i class="fa fa-minus" aria-hidden="true"></i>
          </div>
          
          <div class="item-info">
            <span class="item-name">Order #12345</span>
            <span class="item-date">26 June, 2025</span>
          </div>
          
          <span class="transaction-amount debit">- $150.00</span>
        </div>
      </div>
    </div>
  </div>
</ion-content>
