
<ion-content class="ioncontent">
  <div class="container zero_padding">
    <div class="row header_row">
      <div class="my_common_header">
        <ion-col size="2" class="common_header">
          <div (click)="goBack()" class="back_arrow_div">
            <i class="fa fa-chevron-circle-left" aria-hidden="true"></i>
          </div>
        </ion-col>
        <ion-col size="8" class="upload_product_heading">
          <h2>Change Password</h2>
        </ion-col>
        <ion-col size="2" class="check_right" (click)="onChangePassword()">
          <i class="fa fa-check" aria-hidden="true"></i>
        </ion-col>
      </div>
    </div>
  </div>

  <div class="container body_container">
    <div class="bg_container">
      
      <div class="form_input_box">
        <label for="previous_password">Previous Password</label>
          <div class="psw_box">
            <input [type]="isPrevPasswordVisible ? 'text' : 'password'" [(ngModel)]="previous_password" id="previous_password" name="previous_password" class="form-control" placeholder="Enter Previous Password">
            <span class="eye_box" (click)="togglePrevPasswordVisibility()">
              <i class="fa fa-eye"  aria-hidden="true"></i> <!-- [ngClass]="isPrevPasswordVisible ? 'fa-eye-slash' : 'fa-eye'" -->
            </span>
          </div>
      </div>

      <div class="form_input_box">
        <label for="new_password">New Password</label>
          <div class="psw_box">
            <input [type]="isNewPasswordVisible ? 'text' : 'password'" [(ngModel)]="password" id="new_password" name="password" class="form-control" placeholder="Enter New Password">
            <span class="eye_box" (click)="toggleNewPasswordVisibility()">
              <i class="fa fa-eye"  aria-hidden="true"></i> <!-- [ngClass]="isPrevPasswordVisible ? 'fa-eye-slash' : 'fa-eye'" -->
            </span>
          </div>
      </div>

      <div class="form_input_box">
        <label for="confirm_password">Confirm Password</label>
          <div class="psw_box">
            <input [type]="isConfirmPasswordVisible ? 'text' : 'password'" [(ngModel)]="confirm_password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm Your Password">
            <span class="eye_box" (click)="toggleConfirmPasswordVisibility()">
              <i class="fa fa-eye"  aria-hidden="true"></i> <!-- [ngClass]="isPrevPasswordVisible ? 'fa-eye-slash' : 'fa-eye'" -->
            </span>
          </div>
      </div>
    </div>
  </div>

</ion-content>
<app-footer-tabs></app-footer-tabs>
