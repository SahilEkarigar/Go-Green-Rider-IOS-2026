<ion-content class="ioncontent">
  <div class="zero_padding">
    <div class="row header_row">
      <div class="my_common_header">
        <ion-col size="2" class="common_header">
          <div (click)="goBack()" class="back_arrow_div">
            <i class="fa fa-chevron-circle-left" aria-hidden="true"></i>
          </div>
        </ion-col>
        <ion-col size="8" class="upload_product_heading">
          <h2>Rider Documentation</h2>
        </ion-col>
        <ion-col size="2" class="check_right">
          <i class="fa fa-check" aria-hidden="true"></i>
        </ion-col>
      </div>
    </div>
  </div>

  <div class="container body_container pBottom">
    <div class="contain-bank">
      <div class="content-vehicle">
        <!-- Add Documents Button -->
        <!-- Upload New Document -->
        <div class="form_input_box">
          <label>Add Documents</label>
          <div class="document-upload">
            <input type="file" class="upload-input" (change)="handleInitialFileUpload($event)"
              accept=".jpg,.jpeg,.png,.pdf" />
          </div>
        </div>

        <!-- List of Uploaded Documents -->
        <div class="form_input_box" *ngFor="let document of uploadedDocs">
          <div class="document-upload">
            <div class="image-preview-container">
              <img [src]="document.preview" alt="Document" class="preview-image"
                (error)="handleImageFallback($event)" />

              <!-- Edit and Delete Icons -->
              <div class="image-actions">
                <!-- Edit: triggers hidden input -->
                <label [attr.for]="'upload_doc_' + document.id" class="edit-icon">
                  <i class="fa fa-pencil" aria-hidden="true"></i>
                </label>

                <!-- Delete: removes document -->
                <button type="button" class="remove-icon" (click)="deleteUploadedDocument(document.id)">
                  <i class="fa fa-trash" aria-hidden="true"></i>
                </button>
              </div>

              <!-- Hidden file input for edit -->
              <input type="file" [id]="'upload_doc_' + document.id" accept=".jpg,.jpeg,.png,.pdf"
                (change)="updateExistingDocument($event, document.id)" style="display: none;" />
            </div>

            <!-- File name below preview -->
            <div *ngIf="document.name" class="file-name">
              <i class="fa fa-paperclip" aria-hidden="true"></i> {{ document.name }}
            </div>
          </div>
        </div>



        <!-- Dynamic Documents Section -->


        <!-- Driving Licence Upload Section -->
        <div class="form_input_box">
          <label>Driving Licence</label>
          <div class="document-upload">
            <div class="image-preview-container">
              <img [src]="drivingLicencePreview" alt="Driving Licence" class="preview-image"
                (error)="onImageError($event)" />

              <div class="image-actions">
                <label for="drivingLicence" class="edit-icon">
                  <i class="fa fa-pencil" aria-hidden="true"></i>
                </label>
                <button *ngIf="drivingLicenceName" type="button" class="remove-icon" (click)="removeDrivingLicence()">
                  <i class="fa fa-trash" aria-hidden="true"></i>
                </button>
              </div>

              <input type="file" id="drivingLicence" name="drivingLicence" accept=".jpg,.jpeg,.png,.pdf"
                (change)="onDrivingLicenceChange($event)" style="display: none;" />
            </div>
            <div *ngIf="drivingLicenceName" class="file-name">
              <i class="fa fa-paperclip" aria-hidden="true"></i> {{ drivingLicenceName }}
            </div>
          </div>
        </div>

        <!-- Registration Document Upload Section -->
        <div class="form_input_box">
          <label>Registration Document</label>
          <div class="document-upload">
            <div class="image-preview-container">
              <img [src]="regDocumentPreview" alt="Registration Document" class="preview-image"
                (error)="onImageError($event)" />

              <div class="image-actions">
                <label for="regDocument" class="edit-icon">
                  <i class="fa fa-pencil" aria-hidden="true"></i>
                </label>
                <button *ngIf="regDocumentName" type="button" class="remove-icon" (click)="removeRegDocument()">
                  <i class="fa fa-trash" aria-hidden="true"></i>
                </button>
              </div>

              <input type="file" id="regDocument" name="regDocument" accept=".jpg,.jpeg,.png,.pdf"
                (change)="onRegDocumentChange($event)" style="display: none;" />
            </div>
            <div *ngIf="regDocumentName" class="file-name">
              <i class="fa fa-paperclip" aria-hidden="true"></i> {{ regDocumentName }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
<app-footer-tabs></app-footer-tabs>
